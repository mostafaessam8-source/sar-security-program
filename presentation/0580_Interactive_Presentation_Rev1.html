<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>0580 Interactive Presentation Rev 1</title>
<style>
:root{--blue:#00778B;--black:#3D3935;--slate:#768692;--sky:#59CBE8;--mid:#71B2C9;--gray:#C8C9C7;--red:#CB2C30;--yellow:#F1B434;--t05:#F2F8F9;--t10:#E6F1F4;
--f:'Diodrum Arabic','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--f);color:var(--black);background:#DDE5E8;overflow:hidden}
button{font-family:inherit;cursor:pointer}
#wrap{position:fixed;inset:0 0 44px 0;display:flex;align-items:center;justify-content:center}
#deckbox{position:relative;box-shadow:0 4px 24px rgba(0,0,0,.25);background:#fff;overflow:hidden}
#deck{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.slide{position:absolute;inset:0;background:#fff;display:none;overflow:hidden}.slide.on{display:block}
.a{position:absolute;overflow:visible}
.t{font-weight:700}.sl{color:var(--slate)}.bl{color:var(--blue)}.vm{display:flex;align-items:center}
.clk{cursor:pointer;transition:box-shadow .12s,background .12s}.clk:hover{box-shadow:0 0 0 2px var(--blue)}
.lbl{font-size:14.7px;font-weight:700;color:var(--blue);letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.card{border:1px solid var(--gray);background:#fff}.card.t5{background:var(--t05)}
.kp{background:var(--t05);border:1px solid var(--t10)}
table.tb{border-collapse:collapse;width:100%;table-layout:fixed}table.tb td,table.tb th{border:.7px solid var(--gray);padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
table.tb th{background:var(--blue);color:#fff;font-weight:700;text-align:right}table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb td{text-align:right}table.tb tr.e td{background:var(--t05)}table.tb tr.tot td{background:var(--t10);color:var(--blue);font-weight:700}
table.tb tr.r{cursor:pointer}table.tb tr.r:hover td{background:#FFF4D6}
.badge{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14.7px}
.bul{margin:0;padding:0;list-style:none}.bul li{pointer-events:auto;position:relative;padding-left:15px;margin-bottom:3px;cursor:pointer}.bul li:before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;background:var(--black)}.bul li:hover{color:var(--blue)}
/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;height:44px;background:#fff;border-top:2px solid var(--blue);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:12.5px}
#bar button{border:1px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;padding:5px 12px;border-radius:2px}#bar button:hover{background:var(--blue);color:#fff}
#dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}#dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--blue);cursor:pointer;display:block}#dots i.on{background:var(--blue)}
#hint{color:var(--slate)}#cnt{font-weight:700;color:var(--blue);min-width:54px;text-align:center}
@media(max-width:760px){#hint{display:none}}
/* drawer */
#dov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:50}#dov.on{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:#fff;z-index:51;transform:translateX(105%);transition:.2s;box-shadow:-4px 0 18px rgba(0,0,0,.25);display:flex;flex-direction:column}
#drawer.on{transform:none}#drawer header{background:var(--blue);color:#fff;padding:16px 56px 14px 20px}#drawer header h2{margin:0;font-size:19px}#drawer header p{margin:3px 0 0;font-size:13px;opacity:.92}
#drawer .x{position:absolute;right:14px;top:10px;background:none;border:0;color:#fff;font-size:28px;line-height:1}
#dB{padding:16px 20px;overflow:auto;flex:1;font-size:14px;line-height:1.45}
#dB table.t,.scr table.t{border-collapse:collapse;width:100%;font-size:13px}.scr table.t th{background:var(--blue);color:#fff;text-align:right;padding:5px 8px;font-size:12px;position:sticky;top:0}.scr table.t th:first-child,.scr table.t td:first-child{text-align:left}.scr table.t td{padding:4px 8px;text-align:right;border-bottom:1px solid #E5E9EB}.scr table.t tr:nth-child(even) td{background:var(--t05)}.scr table.t tr.tot td{font-weight:700;color:var(--blue);background:var(--t10)}.scr table.t tr.rc{cursor:pointer}.scr table.t tr.rc:hover td{background:#FFF4D6}
#dB table.t{}#dB table.t th{background:var(--blue);color:#fff;text-align:right;padding:6px 8px;font-size:12px;position:sticky;top:0}#dB table.t th:first-child,#dB table.t td:first-child{text-align:left}
#dB table.t td{padding:5px 8px;text-align:right;border-bottom:1px solid #E5E9EB}#dB table.t tr:nth-child(even) td{background:var(--t05)}#dB table.t tr.tot td{font-weight:700;color:var(--blue);background:var(--t10)}#dB table.t tr.rc{cursor:pointer}#dB table.t tr.rc:hover td{background:#FFF4D6}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;color:#fff;border-radius:2px;line-height:1.3}
.dn{font-size:12.5px;color:var(--slate)}.dbtn{background:var(--blue);color:#fff;border:0;padding:8px 16px;font-weight:700;font-size:13px;margin:6px 6px 6px 0}
.bar{height:9px;background:var(--t10);margin-top:3px}.bar i{display:block;height:100%;background:var(--blue)}
/* gantt */
.gantt{position:relative;border:1px solid var(--gray);background:#fff;overflow:hidden;font-size:12px}
.scr .gantt{overflow:visible}.scr .gh{position:sticky;top:0;z-index:5}
.gh .gm.q{height:46px}.gh .gm.q span.qc{top:2px;height:20px;padding:0;border-left:1px solid #fff;overflow:visible}.gh .gm.q span.mt{top:28px;height:auto;border:0;padding:0;overflow:visible}
.gm .qc{position:absolute;top:2px;height:20px;border:1px solid #fff;text-align:center;line-height:18px;font-weight:700;background:var(--t05);color:var(--blue);font-size:12px}.gm .qc.o{background:var(--t10)}.gm .mt{position:absolute;top:27px;transform:translateX(-50%);font-size:11px;font-weight:400;color:var(--slate)}
.gr.big .gl .n{font-size:15px;font-weight:700;color:var(--black)}.gr.big .gl small{font-size:11px}.gr.big .gb{font-size:12.5px;padding-left:8px}.gr.big.lv0 .gl .n{color:var(--black);white-space:normal;font-size:12.5px;line-height:1.15}
.gc{padding:3px 6px;text-align:right;white-space:nowrap;display:flex;align-items:center;justify-content:flex-end;border-right:1px solid #EEF1F2;font-size:11px}.gr .gc{color:#4a4a4a}
.gh{display:flex;background:var(--t10);border-bottom:1px solid var(--gray);font-size:11px;font-weight:700;color:var(--blue)}
.gh .gl,.gr .gl{flex:0 0 var(--lw,260px);padding:3px 8px;min-width:0}.gh .gm{flex:1;position:relative;height:24px}.gh .gm span{position:absolute;top:0;height:100%;border-left:1px solid #fff;padding:4px 3px;white-space:nowrap;overflow:hidden}
.gr{display:flex;border-bottom:1px solid #EEF1F2;min-height:var(--rh,24px);align-items:stretch}.gr:hover{background:#FAFCFC}.gr.c{cursor:pointer}.gr.lv1{background:var(--t10);font-weight:700}.gr.lv0{background:var(--t05);font-weight:700;color:var(--blue)}
.gr .gl{display:flex;flex-direction:column;justify-content:center;border-right:1px solid #EEF1F2;overflow:hidden}.gr .gl small{font-size:10px;color:var(--slate);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gr .gl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gr .gt{flex:1;position:relative}
.gb{position:absolute;border-radius:2px;color:#fff;font-size:10px;line-height:1;overflow:hidden;white-space:nowrap;padding:0 4px;display:flex;align-items:center;font-weight:700}.gbo{position:absolute;display:flex;align-items:center;padding-left:6px;font-size:12.5px;font-weight:700;color:var(--black);white-space:nowrap}.gb.dk{color:var(--black)}
.gd{position:absolute;width:12px;height:12px;transform:translate(-50%,0) rotate(45deg);border:2px solid var(--black);background:#fff}.gd.f{background:var(--black)}
.gvl{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed #D5DBDD;pointer-events:none}.gband{position:absolute;top:0;bottom:0;pointer-events:none}.gend{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--red);pointer-events:none}
.chip{border:1px solid var(--gray);background:#fff;padding:3px 9px;font-size:12.5px;border-radius:3px;color:var(--black)}.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}.chip:hover{border-color:var(--blue)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--blue)}.tabs button{border:0;background:var(--t10);padding:6px 14px;font-weight:700;color:var(--black);font-size:13px}.tabs button.on{background:var(--blue);color:#fff}
.stl{display:flex;flex-direction:column;gap:3px;overflow:auto}.stl button{text-align:left;border:1px solid var(--gray);background:#fff;padding:4px 8px;font-size:12.5px;border-left-width:6px;line-height:1.2}.stl button.on{background:var(--blue);color:#fff;border-color:var(--blue)}.stl button small{display:block;opacity:.75;font-size:10.5px}
.stl button.NSR{border-left-color:var(--blue)}.stl button.EWR{border-left-color:var(--yellow)}.stl button.HHR{border-left-color:var(--black)}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;align-items:center}.leg i{display:inline-block;width:13px;height:10px;border-radius:2px;margin-right:4px}
.scr{overflow:auto}
input[type=range]{accent-color:var(--blue)}select{font-family:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--gray)}
#tb{position:relative;display:flex;flex-direction:column;gap:3px;flex:0 0 auto}.tr{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;font-size:12px;white-space:nowrap}.tr b{color:var(--blue);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.sg{display:flex;gap:4px;align-items:center}.tr .chip{padding:2px 8px;font-size:12px;cursor:pointer}.tr select,.tr input[type=text]{font-size:12px;padding:2px 5px;height:24px}
.tabs2{display:flex}.tabs2 button{border:1px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;padding:3px 12px;font-size:12.5px}.tabs2 button.on{background:var(--blue);color:#fff}
.bd{background:var(--red);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:3px}
.pop{position:absolute;z-index:40;background:#fff;border:1px solid var(--blue);box-shadow:0 4px 14px rgba(0,0,0,.25);min-width:220px;max-height:260px;display:flex;flex-direction:column}.pop .ph{display:flex;justify-content:space-between;padding:5px 8px;background:var(--t10);font-size:12px}.pop .ph a{color:var(--blue);cursor:pointer;text-decoration:underline}.pop .pl{overflow:auto;padding:4px 8px}.pop label{display:block;font-size:12.5px;padding:2px 0;white-space:nowrap;cursor:pointer}
@media print{#bar,#drawer,#dov{display:none}body{overflow:visible;background:#fff}#wrap{position:static;display:block}#deckbox{box-shadow:none;width:auto!important;height:auto!important}#deck{position:static;transform:none!important}.slide{display:block!important;position:relative;width:1280px;height:720px;page-break-after:always}}
</style></head><body>

    mkChart('dc1',{type:'line',data:{labels:lab,datasets:[{label:'Cost progress %',data:cc.map(v=>+(v/tc*100).toFixed(1)),borderColor:C.blue,backgroundColor:C.blue,pointRadius:ctx=>ctx.dataIndex===m&&mo?5:0,tension:.25},{label:'Time progress %',data:pp.map(v=>+(v/tp*100).toFixed(1)),borderColor:C.yellow,backgroundColor:C.yellow,borderDash:[5,3],pointRadius:ctx=>ctx.dataIndex===m&&mo?5:0,tension:.25}]},options:{animation:false,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:10,font:{size:10}}},title:{display:true,text:'Cumulative time and cost progress (%)',color:C.blue,font:{size:12,weight:'normal'}}},scales:{y:{min:0,max:100,ticks:{font:{size:9}}},x:{ticks:{font:{size:8},maxRotation:90,maxTicksLimit:18}}}}});
    mkChart('dc2',{type:'bar',data:{labels:lab,datasets:[{label:'SAR M',data:im.map(x=>+(x/1e6).toFixed(2)),backgroundColor:im.map((_,i)=>i===m&&mo?C.red:C.blue)}]},options:{animation:false,maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:true,text:'Invoices per month (SAR million)',color:C.blue,font:{size:12,weight:'normal'}}},scales:{x:{ticks:{font:{size:8},maxRotation:90,maxTicksLimit:18}},y:{ticks:{font:{size:9}}}}}});}
  function showCharts(){drawer('Progress and invoices','Selection and month as set on the dashboard','<div style="position:relative;height:260px"><canvas id="dc1"></canvas></div><div style="position:relative;height:260px;margin-top:14px"><canvas id="dc2"></canvas></div>');setTimeout(drawCharts,60);}
  function draw(){const sel=ST.filter(s=>lines.has(s.line)&&pr.has(s.prio));const all=sel.length===ST.length;
    const cs=Array(36).fill(0),ps=Array(36).fill(0);sel.forEach(s=>{s.cc.forEach((v,i)=>cs[i]+=v);s.pc.forEach((v,i)=>ps[i]+=v);});if(all){DATA.prj.cc.forEach((v,i)=>cs[i]+=v);DATA.prj.pc.forEach((v,i)=>ps[i]+=v);}
    const tc=cs.reduce((a,x)=>a+x,0),tp=ps.reduce((a,x)=>a+x,0);let a=0,b=0;const cc=cs.map(v=>a+=v),pp=ps.map(v=>b+=v);const m=Math.min(35,Math.max(0,mo-1));
    const inv=DATA.events.filter(e=>e.c==='PRJ'?all:sel.some(s=>s.code===e.c)).map(e=>({...e,m:monIdx(e.d)}));const invTo=inv.filter(e=>e.m<=m).reduce((x,e)=>x+e.a,0),invTot=inv.reduce((x,e)=>x+e.a,0);const acc=sel.filter(s=>monIdx(s.end)<=m).length;
    $('#dmo',el).textContent=mo===0?'Notice to Proceed ('+fD(M.ntp)+')':'Month '+mo+' ('+mFull(mo-1)+')';
    $('#dk',el).innerHTML=[[sel.length+' of 14','stations selected','SAR '+fM(sel.reduce((x,s)=>x+s.val,0))+'M station value'],[mo?fP(cc[m]/tc):'0.0%','cost progress (planned)','SAR '+fM(mo?cc[m]:0)+'M of '+fM(tc)+'M'],[mo?fP(pp[m]/tp):'0.0%','time progress','fair EPC distribution'],['SAR '+fM(mo?invTo:0)+'M','invoiced to date','of SAR '+fM(invTot)+'M'],[acc+'','stations accepted','by the end of the month']].map(k=>`<div class="kp" style="padding:6px 12px"><div style="font-size:20px;font-weight:700;color:${C.blue};line-height:1.15">${k[0]}</div><div style="font-size:13px;font-weight:700">${k[1]}</div><div style="font-size:11px;color:${C.slate}">${k[2]}</div></div>`).join('');
    const im=Array(36).fill(0);inv.forEach(e=>im[Math.min(35,e.m)]+=e.a);CD={cc,pp,tc,tp,m,mo,im,inv};if($('#dc1')){drawCharts();}
    const mm=(x,y)=>fM(x);const rowsD=sel.slice().sort((x,y)=>(x.start<y.start?-1:1)).map(s=>{let c=0,p=0;for(let i=0;i<=m&&mo;i++){c+=s.cc[i];p+=s.pc[i];}return {s,c,p};});
    const td=(v,al='right',x='')=>`<td style="text-align:${al};padding:4px 6px;border-bottom:1px solid #E5E9EB;white-space:nowrap;${x}">${v}</td>`;
    const th=(v,al='right')=>`<th style="background:${C.blue};color:#fff;padding:5px 6px;text-align:${al};position:sticky;top:0;font-size:11.5px;white-space:nowrap">${v}</th>`;
    let prjC=0;if(all){for(let i=0;i<=m&&mo;i++)prjC+=DATA.prj.cc[i];}const prjT=all?DATA.prj.cc.reduce((a,x)=>a+x,0):0;
    const totC=rowsD.reduce((a,r)=>a+r.s.cost,0)+prjT,totD=rowsD.reduce((a,r)=>a+r.c,0)+prjC;
    $('#dt',el).innerHTML=`<table class="t" style="border-collapse:collapse;width:100%;font-size:12px"><thead><tr>${th('Station','left')}${th('Total cost (SAR M)')}${th('Cost to date (SAR M)')}${th('Cost %')}${th('Time %')}${th('Start')}${th('Finish')}${th('Status')}</tr></thead><tbody>${rowsD.map(({s,c,p})=>{const st=monIdx(s.end)<=m?['Accepted',C.blue,'#fff']:monIdx(s.start)<=m&&mo?['In progress',C.yellow,C.black]:['Not started',C.gray,C.black];return `<tr data-c="${s.code}" style="cursor:pointer">${td(esc(s.name)+' '+lt(s.line),'left','font-weight:700')}${td(fM(s.cost))}${td(fM(c))}${td(fP(c/s.cost))}${td(fP(p/s.prog))}${td(fD(s.start))}${td(fD(s.end))}${td(`<span class="tag" style="background:${st[1]};color:${st[2]};display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:2px">${st[0]}</span>`)}</tr>`;}).join('')}${all?`<tr data-prj="1">${td('Project level (mobilization, baselines, closeout)','left','font-weight:700')}${td(fM(prjT))}${td(fM(prjC))}${td(fP(prjC/(prjT||1)))}${td('-')}${td(fD(ABY['PRJ-M0000'].s))}${td(fD(M.end))}${td('')}</tr>`:''}<tr class="tot"><td style="padding:5px 6px;font-weight:700;color:${C.blue};background:${C.t10}">Total (${sel.length} stations${all?' and project level':''})</td><td style="text-align:right;padding:5px 6px;font-weight:700;color:${C.blue};background:${C.t10}">${fM(totC)}</td><td style="text-align:right;padding:5px 6px;font-weight:700;color:${C.blue};background:${C.t10}">${fM(totD)}</td><td style="text-align:right;padding:5px 6px;font-weight:700;color:${C.blue};background:${C.t10}">${fP(totD/(totC||1))}</td><td style="text-align:right;padding:5px 6px;font-weight:700;color:${C.blue};background:${C.t10}">${mo?fP(pp[m]/tp):'0.0%'}</td><td style="background:${C.t10}"></td><td style="background:${C.t10}"></td><td style="background:${C.t10}"></td></tr></tbody></table>`;
    $$('#dt tr[data-c]',el).forEach(r=>r.onclick=()=>openStation(r.dataset.c));}
  $$('[data-l]',el).forEach(b=>b.onclick=()=>{const l=b.dataset.l;if(lines.has(l)&&lines.size>1)lines.delete(l);else lines.add(l);b.classList.toggle('on',lines.has(l));draw();});
  $$('[data-p]',el).forEach(b=>b.onclick=()=>{const p=+b.dataset.p;if(pr.has(p)&&pr.size>1)pr.delete(p);else pr.add(p);b.classList.toggle('on',pr.has(p));draw();});
  $('#chb',el).onclick=()=>showCharts();
  $('#dsl',el).oninput=e=>{mo=+e.target.value;draw();};draw();
});
/* ===== 12 closing ===== */
slide('end',el=>{el.innerHTML=`<div class="a" style="left:0;top:0;width:1280px;height:720px;background:${C.blue}"></div>
  ${E(0,0,13.33,7.5,'','','clip-path:polygon(395px 340px,467px 340px,444px 720px,371px 720px);background:#fff')}${E(0,0,13.33,7.5,'','','clip-path:polygon(812px 340px,886px 340px,910px 720px,835px 720px);background:#fff')}
  ${T(0,2.25,13.33,.8,'Thank You',33,{b:1,c:'#fff',al:'center',vm:1})}
  <img class="a" src="${LOGOW}" alt="SAR" style="left:${640-40}px;top:${440}px;width:80px">
  ${T(0,6.75,13.33,.3,'SAR.COM.SA',9,{c:'#fff',al:'center'})}
  ${E(3.9,3.1,5.5,.4,'Key assumptions','clk vm','justify-content:center;color:#fff;border:1.5px solid #fff;font-weight:700;font-size:15px','data-q="1"')}`;
  $$('[data-q]',el).forEach(b=>b.onclick=()=>drawer('Key assumptions',M.name+' · '+M.rev,'<ul style="padding-left:18px"><li style="margin:8px 0">The survey needs a site access permit that takes two months (months 1 and 2); the survey is the first part of the four-month design.</li><li style="margin:8px 0">Dates are a planning baseline (Notice to Proceed '+fD(M.ntp)+'), not yet approved by SAR.</li><li style="margin:8px 0">Eid dates in the working calendar are estimates.</li><li style="margin:8px 0">SAR review of each submission is 21 days, planned as 15 working days (Sunday to Thursday).</li><li style="margin:8px 0">Mock-up approval: SAR visits Riyadh (Thumamah) after installation and approves the executed works (one month) for roll-out to the other stations; it does not hold back their installation in this baseline.</li><li style="margin:8px 0">Design, survey included, lasts four months at every station and starts when the two-month survey permit is granted; enabling works start two months before design ends (two months of overlap), before the engineering approval. Equipment is released only after approval.</li><li style="margin:8px 0">Amounts are in SAR excluding 15% VAT, from the draft SAR and ETECHS contract and its annexes.</li></ul>'));},'Closing');
/* ---------- boot ---------- */
SL.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide';$('#deck').appendChild(sec);const d=document.createElement('i');d.title=(i+1)+'. '+(s.short||s.id);d.onclick=()=>go(i);$('#dots').appendChild(d);});
$('#bP').onclick=()=>go(cur-1);$('#bN').onclick=()=>go(cur+1);
$('#bF').onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen();};
addEventListener('keydown',e=>{if(/input|select|textarea/i.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(cur+1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);else if(e.key==='Escape')closeD();});
fit();(function(){const i=SL.findIndex(s=>s.id===location.hash.slice(1));go(i>=0?i:0,true);})();
</script></body></html>
