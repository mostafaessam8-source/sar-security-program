<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>0580 Interactive Presentation Rev 1</title>
<style>
:root{--blue:#00778B;--black:#3D3935;--slate:#768692;--sky:#59CBE8;--mid:#71B2C9;--gray:#C8C9C7;--red:#CB2C30;--yellow:#F1B434;--t05:#F2F8F9;--t10:#E6F1F4;--white:#fff;--bg:#fff;--fg:#3D3935;--line:#C8C9C7;
--f:'Diodrum Arabic','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--f);color:var(--fg);background:#EEF3F5;font-size:15px;line-height:1.4}
button{font-family:inherit;cursor:pointer}
header#top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:3px solid var(--blue);display:flex;align-items:center;gap:14px;padding:8px 18px}
header#top img{height:38px}
.ttl{display:flex;flex-direction:column;min-width:0;flex:0 1 330px}.ttl b{color:var(--blue);font-size:16px}.ttl span{font-size:11px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav#pills{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:thin;padding:2px}
nav#pills button{border:1px solid var(--line);background:#fff;color:var(--black);padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap;border-radius:2px}
nav#pills button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
nav#pills button:hover:not(.on){background:var(--t10)}
.ctl{display:flex;gap:6px}.ctl button{border:1px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;padding:6px 12px;border-radius:2px}.ctl button:hover{background:var(--blue);color:#fff}
main#stage{max-width:1380px;margin:0 auto;padding:18px}
section.slide{display:none;background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.06);padding:26px 30px 22px;min-height:calc(100vh - 150px);position:relative}
section.slide.on{display:block}
h1.st{margin:0 0 4px;font-size:26px;color:var(--blue);padding-left:16px;position:relative;line-height:1.2}
h1.st:before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:7px;background:var(--blue);transform:skewX(-14deg)}
p.sub{margin:0 0 16px 16px;color:var(--slate);font-size:14px}
.foot{margin-top:18px;border-top:1px solid var(--blue);padding-top:6px;font-size:11px;color:var(--slate);display:flex;justify-content:space-between;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:10px 0 16px}
.kpi{background:var(--t05);border:1px solid var(--t10);padding:10px 14px}.kpi b{display:block;font-size:24px;color:var(--blue);line-height:1.2}.kpi span{font-size:13px;font-weight:700}.kpi i{display:block;font-style:normal;font-size:11.5px;color:var(--slate)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g12{grid-template-columns:1.25fr 1fr}.g21{grid-template-columns:1fr 1.15fr}
@media(max-width:900px){.g2,.g3,.g12,.g21{grid-template-columns:1fr}header#top{flex-wrap:wrap}.ttl{flex:1 1 200px}}
.card{border:1px solid var(--line);padding:12px 14px;background:#fff}.card.alt{background:var(--t05)}
.card h3{margin:0 0 5px;font-size:14.5px;color:var(--blue)}.card p{margin:0;font-size:13px}.card ul{margin:0;padding-left:17px;font-size:13px}.card li{margin:2px 0}
.card.click{cursor:pointer;transition:.12s}.card.click:hover{border-color:var(--blue);box-shadow:0 0 0 2px var(--t10)}
h4.lb{margin:14px 0 6px;font-size:12px;letter-spacing:1px;color:var(--blue);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:#fff;padding:4px 10px;font-size:12.5px;border-radius:14px;color:var(--black)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}.chip[class*=' b-']{border-radius:3px}.chip.b-NSR{border-left:6px solid var(--blue)}.chip.b-EWR{border-left:6px solid var(--yellow)}.chip.b-HHR{border-left:6px solid var(--black)}
button.chip:hover{border-color:var(--blue)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;color:#fff;background:var(--slate);border-radius:2px}.tag.p1{background:var(--red)}.tag.p2{background:var(--yellow);color:var(--black)}.tag.ok{background:var(--blue)}.tag.wip{background:var(--yellow);color:var(--black)}.tag.na{background:var(--gray);color:var(--black)}
table.t{border-collapse:collapse;width:100%;font-size:13px}table.t th{background:var(--blue);color:#fff;text-align:right;padding:6px 8px;font-size:12px;position:sticky;top:0}table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:5px 8px;text-align:right;border-bottom:1px solid #E5E9EB}table.t tr:nth-child(even) td{background:var(--t05)}table.t tr.tot td{font-weight:700;color:var(--blue);background:var(--t10)}table.t tr.hl td{background:#FFF4D6}
table.t tr.rowc{cursor:pointer}table.t tr.rowc:hover td{background:var(--t10)}
.scroll{overflow:auto;max-height:520px;border:1px solid var(--line)}
.note{font-size:12px;color:var(--slate)}
/* gantt */
.gantt{position:relative;border:1px solid var(--line);background:#fff;overflow:hidden}
.gh{display:flex;background:var(--t10);border-bottom:1px solid var(--line);font-size:11px;font-weight:700;color:var(--blue)}
.gh .gl,.gr .gl{flex:0 0 var(--lw,260px);padding:4px 8px;min-width:0}
.gh .gm{flex:1;position:relative;height:30px}.gh .gm span{position:absolute;top:0;height:100%;border-left:1px solid #fff;padding:2px 3px;white-space:nowrap;overflow:hidden}
.gr{display:flex;border-bottom:1px solid #EEF1F2;min-height:var(--rh,26px);align-items:stretch}
.gr:hover{background:#FAFCFC}.gr.c{cursor:pointer}.gr.lv1{background:var(--t10);font-weight:700}.gr.lv0{background:var(--t05);font-weight:700;color:var(--blue)}
.gr .gl{font-size:12.5px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid #EEF1F2;overflow:hidden}.gr .gl small{font-size:10.5px;color:var(--slate);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .gl span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .gt{flex:1;position:relative}
.gb{position:absolute;border-radius:2px;color:#fff;font-size:10.5px;line-height:1;overflow:hidden;white-space:nowrap;padding:0 4px;display:flex;align-items:center;font-weight:700}
.gb.dk{color:var(--black)}
.gd{position:absolute;width:13px;height:13px;transform:translate(-50%,0) rotate(45deg);border:2px solid var(--black);background:#fff}
.gd.f{background:var(--black)}
.gvl{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed #D5DBDD;pointer-events:none}
.gband{position:absolute;top:0;bottom:0;pointer-events:none}
.gend{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--red);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0;font-size:12px}.legend label{display:flex;align-items:center;gap:5px;cursor:pointer}.legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
/* drawer */
#dov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:50}#dov.on{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#fff;z-index:51;transform:translateX(105%);transition:.2s;box-shadow:-4px 0 18px rgba(0,0,0,.2);display:flex;flex-direction:column}
#drawer.on{transform:none}#drawer header{background:var(--blue);color:#fff;padding:14px 18px}#drawer header h2{margin:0;font-size:18px}#drawer header p{margin:3px 0 0;font-size:12.5px;opacity:.9}
#drawer .x{position:absolute;right:12px;top:10px;background:none;border:0;color:#fff;font-size:26px;line-height:1}
#dB{padding:14px 18px;overflow:auto;flex:1;font-size:13.5px}
/* cover/closing */
.cover,section.slide.cover{background:linear-gradient(120deg,var(--blue) 0 62%,#fff 62% 100%);padding:0;min-height:calc(100vh - 150px);overflow:hidden}
section.slide.cover.on{display:flex}
.cover .l{flex:0 0 62%;color:#fff;padding:60px 56px;display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative}
.cover .l img{height:60px;align-self:flex-start;margin-bottom:24px}.cover h1{margin:0;font-size:40px;line-height:1.15}.cover .no{font-size:76px;font-weight:800;line-height:1;letter-spacing:2px;color:var(--yellow)}
.cover .s{font-size:18px;opacity:.95;max-width:760px}.cover .m{font-size:13px;opacity:.85;margin-top:18px}
.cover .r{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;position:relative}
.cover .r:before,.cover .r:after{content:"";position:absolute;left:-60px;width:170%;height:10px;background:var(--blue);transform:rotate(-24deg);top:44%}.cover .r:after{top:52%;height:6px;background:var(--yellow)}
.cover .go{margin-top:24px;align-self:flex-start;background:var(--yellow);color:var(--black);border:0;font-weight:800;padding:12px 26px;font-size:15px}
section.slide.cover.end{background:linear-gradient(120deg,var(--blue) 0 100%)}
input[type=range]{width:100%;accent-color:var(--blue)}select,input[type=text]{font-family:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line)}
.btn{background:var(--blue);color:#fff;border:0;padding:7px 14px;font-weight:700;font-size:12.5px}.btn.o{background:#fff;color:var(--blue);border:1px solid var(--blue)}.btn:hover{filter:brightness(.92)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--blue);margin:10px 0}.tabs button{border:0;background:var(--t10);padding:8px 16px;font-weight:700;color:var(--black)}.tabs button.on{background:var(--blue);color:#fff}
.stl{display:flex;flex-direction:column;gap:3px;max-height:640px;overflow:auto;padding-right:4px}
.stl button{text-align:left;border:1px solid var(--line);background:#fff;padding:6px 9px;font-size:12.5px;border-left-width:6px}.stl button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.stl button.NSR{border-left-color:var(--blue)}.stl button.EWR{border-left-color:var(--yellow)}.stl button.HHR{border-left-color:var(--black)}.stl button small{display:block;opacity:.75;font-size:11px}
.l3{display:grid;grid-template-columns:230px 1fr;gap:16px}@media(max-width:900px){.l3{grid-template-columns:1fr}.stl{max-height:200px;flex-direction:row;flex-wrap:wrap}}
.big{font-size:44px;font-weight:800;color:var(--red);line-height:1}
.cv{position:relative;height:300px}
.pillbar{height:8px;background:var(--t10);border-radius:4px;overflow:hidden}.pillbar i{display:block;height:100%;background:var(--blue)}
@media print{header#top,.ctl,#drawer,#dov{display:none}body{background:#fff}section.slide{display:block!important;page-break-after:always;border:0;box-shadow:none}}
</style></head><body>
<header id="top"><img alt="Saudi Arabia Railways" src="data:image/png;base64,%%LOGO%%"><div class="ttl"><b id="hNo"></b><span id="hName"></span></div><nav id="pills"></nav><div class="ctl"><button id="bPrev" title="Previous (left arrow)">&#9664;</button><button id="bNext" title="Next (right arrow)">&#9654;</button><button id="bFs" title="Full screen">&#x26F6;</button></div></header>
<main id="stage"></main>
<div id="dov"></div><aside id="drawer" aria-hidden="true"><header><button class="x" id="dX" aria-label="Close">&times;</button><h2 id="dT"></h2><p id="dS"></p></header><div id="dB"></div></aside>
<script>%%CHART%%</script>
<script>const DATA=%%DATA%%;const LOGOW="data:image/png;base64,%%LOGOW%%";</script>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const M=DATA.meta,ST=DATA.stations,AC=DATA.acts,MON=DATA.months;
const C={blue:'#00778B',black:'#3D3935',slate:'#768692',sky:'#59CBE8',mid:'#71B2C9',gray:'#C8C9C7',red:'#CB2C30',yellow:'#F1B434'};
const LC={NSR:C.blue,EWR:C.yellow,HHR:C.black};
const PH={MOB:['Mobilization and site survey',C.gray,1],DES:['Design',C.blue,0],POC:['Proof of concept',C.yellow,1],ENA:['Enabling works',C.sky,1],PRO:['Procurement and supply',C.black,0],CON:['Construction and installation',C.red,0],COM:['Testing, commissioning and handover',C.slate,0],PMG:['Project management',C.mid,0]};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(Date.UTC(a,b-1,c));};
const fD=s=>{const d=dd(s);return String(d.getUTCDate()).padStart(2,'0')+' '+MN[d.getUTCMonth()]+' '+d.getUTCFullYear();};
const fN=v=>Math.round(v).toLocaleString('en-US'),fM=v=>(v/1e6).toFixed(2),fP=(v,n=1)=>(v*100).toFixed(n)+'%';
const mLab=i=>{const[y,m]=MON[i].split('-').map(Number);return MN[m-1]+' '+String(y).slice(2);};
const mFull=i=>{const[y,m]=MON[i].split('-').map(Number);return MN[m-1]+' '+y;};
const monIdx=s=>{const d=dd(s),n=dd(M.ntp);return (d.getUTCFullYear()-n.getUTCFullYear())*12+d.getUTCMonth()-n.getUTCMonth();};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SBY=Object.fromEntries(ST.map(s=>[s.code,s]));const ABY=Object.fromEntries(AC.map(a=>[a.id,a]));
const lt=l=>`<span class="tag" style="background:${LC[l]};${l==='EWR'?'color:#3D3935':''}">${l}</span>`;
const prTag=s=>s.prio===1?'<span class="tag p1">Priority 1</span>':s.prio===2?'<span class="tag p2">Priority 2</span>':'';
const star=s=>s.prio===1?' ★':s.prio===2?' ☆':'';
const CH={};
function mkChart(id,cfg){if(CH[id])CH[id].destroy();const cv=document.getElementById(id);if(!cv)return;CH[id]=new Chart(cv,Object.assign({options:{}},cfg));}
Chart.defaults.font.family="'Diodrum Arabic','Segoe UI',system-ui,sans-serif";Chart.defaults.font.size=11;
/* ---------- drawer ---------- */
function drawer(t,s,html){$('#dT').textContent=t;$('#dS').innerHTML=s||'';$('#dB').innerHTML=html;$('#drawer').classList.add('on');$('#dov').classList.add('on');$('#dB').scrollTop=0;}
function closeD(){$('#drawer').classList.remove('on');$('#dov').classList.remove('on');}
$('#dX').onclick=closeD;$('#dov').onclick=closeD;
const tbl=(h,rows,cls='')=>`<table class="t ${cls}"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
const actRows=l=>l.map(a=>`<tr><td>${a.id}</td><td style="text-align:left">${esc(a.n)}</td><td>${fD(a.s)}</td><td>${a.t==='T'?fD(a.f):'milestone'}</td><td>${a.t==='T'?a.d:'-'}</td></tr>`);
const actTable=l=>tbl(['ID','Activity','Start','Finish','Days'],actRows(l)).replace('<th>Activity','<th style="text-align:left">Activity');
/* ---------- generic gantt ---------- */
function gantt(host,o){
  const t0=dd(o.from).getTime(),t1=dd(o.to).getTime(),span=t1-t0,pc=d=>Math.max(0,Math.min(100,(dd(d).getTime()-t0)/span*100));
  const pcr=d=>(dd(d).getTime()-t0)/span*100;
  const lw=o.lw||260,rh=o.rh||26;let h=`<div class="gantt" style="--lw:${lw}px;--rh:${rh}px"><div class="gh"><div class="gl">${o.head||'Activity'}</div><div class="gm">`;
  const months=[];let d=new Date(t0);d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1));
  while(d.getTime()<t1){months.push(d.getTime());d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1));}
  const step=o.step||1;
  months.forEach((m,i)=>{const nx=months[i+1]||t1,l=Math.max(0,(m-t0)/span*100),w=(nx-Math.max(m,t0))/span*100;if(i%step===0){const dt=new Date(m);h+=`<span style="left:${l}%;width:${w*step}%">${o.mlab?o.mlab(i,dt):MN[dt.getUTCMonth()]+" '"+String(dt.getUTCFullYear()).slice(2)}</span>`;}});
  h+='</div></div><div style="position:relative">';
  h+=`<div style="position:absolute;left:${lw}px;right:0;top:0;bottom:0;pointer-events:none">`;
  months.forEach((m,i)=>{if(i%step===0){const l=(m-t0)/span*100;if(l>=0&&l<100)h+=`<i class="gvl" style="left:${l}%"></i>`;}});
  (o.bands||[]).forEach(b=>{h+=`<i class="gband" style="left:${pc(b.s)}%;width:${pc(b.f)-pc(b.s)}%;background:${b.c}"></i>`;});
  (o.lines||[]).forEach(b=>{const p=pcr(b.d);if(p>=0&&p<=100)h+=`<i class="gend" style="left:${p}%;border-color:${b.c||C.red}" title="${esc(b.t||'')}"></i>`;});
  h+='</div>';
  o.rows.forEach((r,i)=>{
    h+=`<div class="gr ${r.lv===0?'lv0':r.lv===1?'lv1':''} ${r.click?'c':''}" data-i="${i}"><div class="gl" style="padding-left:${8+(r.ind||0)*14}px"><span class="n" title="${esc(r.label)}">${r.label}</span>${r.sub?`<small>${r.sub}</small>`:''}</div><div class="gt">`;
    (r.bars||[]).forEach(b=>{const l=pcr(b.s),w=Math.max(.35,pcr(b.f)-l+ (100*86400000/span)),cl=Math.max(0,l),cw=Math.min(100,l+w)-cl;if(cw<=0)return;
      const top=b.top!=null?b.top:Math.round((rh-(b.h||12))/2),hh=b.h||12;
      h+=`<i class="gb ${b.dk?'dk':''}" style="left:${cl}%;width:${cw}%;top:${top}px;height:${hh}px;background:${b.c}" title="${esc(b.t||'')}">${b.l&&cw>6?esc(b.l):''}</i>`;});
    (r.ms||[]).forEach(m=>{const p=pcr(m.d);if(p<0||p>100)return;h+=`<i class="gd ${m.f?'f':''}" style="left:${p}%;top:${Math.round((rh-13)/2)}px;border-color:${m.c||C.black}" title="${esc(m.t||'')}"></i>`;});
    h+='</div></div>';
  });
  h+='</div></div>';host.innerHTML=h;
  if(o.click)$$('.gr.c',host).forEach(e=>e.onclick=()=>o.click(o.rows[+e.dataset.i]));
}
const stationWin=(code,phs)=>{const l=AC.filter(a=>a.stn===code&&a.t==='T'&&phs.includes(a.ph));return l.length?[l.reduce((m,a)=>a.s<m?a.s:m,'9999'),l.reduce((m,a)=>a.f>m?a.f:m,'0000')]:null;};
/* ---------- slides ---------- */
const SL=[];function slide(id,title,fn,pill){SL.push({id,title,fn,pill:pill||title,done:false});}
let cur=0;
function go(i,noHash){cur=Math.max(0,Math.min(SL.length-1,i));$$('section.slide').forEach((s,k)=>s.classList.toggle('on',k===cur));$$('#pills button').forEach((b,k)=>b.classList.toggle('on',k===cur));
  const s=SL[cur];if(!s.done||s.always){s.fn($('#sl'+cur));s.done=true;}if(!noHash)try{history.replaceState(null,'','#'+s.id);}catch(e){}
  window.scrollTo({top:0});const p=$$('#pills button')[cur];if(p&&p.scrollIntoView)p.scrollIntoView({inline:'center',block:'nearest'});}
const foot=(n,t)=>`<div class="foot"><span>${esc(M.name)} · ${M.rev}</span><span>${t||''}</span><span>${n}</span></div>`;
const head=(t,s)=>`<h1 class="st">${t}</h1><p class="sub">${s}</p>`;
/* 0 cover */
slide('cover','Cover',el=>{el.className+=' cover';el.innerHTML=`<div class="l"><img src="${LOGOW}" alt="SAR"><div class="no">${M.no}</div><h1>${esc(M.name.replace(/^\d+-/,''))}</h1><div class="s">Scope of work, schedule (Level 2 and Level 3 by station), priorities, proof of concept, review periods, cash flow and dashboard</div><div class="m">Saudi Arabia Railways (SAR) · Contract with ETECHS · ${M.rev} · Notice to Proceed ${fD(M.ntp)} · 36 months · SAR ${fM(M.po)}M excluding VAT</div><button class="go" id="goStart">Start the presentation &#9654;</button></div><div class="r"></div>`;$('#goStart').onclick=()=>go(1);},'Cover');
/* 1 scope */
slide('scope1','Scope of work 1/3',el=>{
  const CARDS=[['CCTV system','Fixed, 90°, 180° panoramic, tandem PTZ, 360°, face recognition and ANPR cameras with line-crossing and direction analytics',['cctv']],['Video management and video wall','Servers, 24-bay storage (8 MP, 15 days, RAID 5), 55-inch video walls and operator workstations',['vms']],['Access control and intercom','Readers, controllers, magnetic locks, ID-card station and IP door station',['ac']],['UPS, poles and network','UPS with 2 hours backup, Cisco core and PoE switches, field cabinets, poles, cabling',['ups','net']],['Civil works','Platform trenches, duct banks, camera poles and ALPR poles',['civil']],['Services','Design, project management, factory acceptance test, commissioning spares, training, 12-month cloud storage',['design','pm','fat','spares','training','cloud']]];

    const im=Array(36).fill(0);inv.forEach(e=>im[Math.min(35,e.m)]+=e.a);

    $('#dt',el).innerHTML=tbl(['Station','Railway','Priority','Cost progress','Time progress','Survey start','Accepted','Status'],sel.slice().sort((x,y)=>(x.prio||9)-(y.prio||9)||(x.end<y.end?-1:1)).map(s=>{let c=0,p=0;for(let i=0;i<=m&&mo;i++){c+=s.cc[i];p+=s.pc[i];}const st=monIdx(s.end)<=m?'<span class="tag ok">Accepted</span>':monIdx(s.start)<=m&&mo?'<span class="tag wip">In progress</span>':'<span class="tag na">Not started</span>';return `<tr class="rowc" data-c="${s.code}"><td>${esc(s.name)}</td><td>${lt(s.line)}</td><td>${prTag(s)||'-'}</td><td>${fP(c/s.cost)}</td><td>${fP(p/s.prog)}</td><td>${fD(s.start)}</td><td>${fD(s.end)}</td><td>${st}</td></tr>`;}));
    $$('#dt tr.rowc',el).forEach(r=>r.onclick=()=>openStation(r.dataset.c));}
  $$('#df [data-l]',el).forEach(b=>b.onclick=()=>{const l=b.dataset.l;if(lines.has(l)&&lines.size>1)lines.delete(l);else lines.add(l);b.classList.toggle('on',lines.has(l));draw();});
  $$('#df [data-p]',el).forEach(b=>b.onclick=()=>{const p=+b.dataset.p;if(pr.has(p)&&pr.size>1)pr.delete(p);else pr.add(p);b.classList.toggle('on',pr.has(p));draw();});
  $('#dsl',el).oninput=e=>{mo=+e.target.value;draw();};draw();
});
/* 11 closing */
slide('end','Closing',el=>{el.className+=' cover end';el.innerHTML=`<div class="l" style="flex:1;align-items:center;text-align:center"><img src="${LOGOW}" alt="SAR" style="align-self:center"><div class="no" style="font-size:54px">Thank you</div><h1 style="font-size:26px">${esc(M.name)}</h1><div class="s" style="max-width:820px">To confirm before issue: official project name spelling · Eid dates (estimated) · Riyadh (Malaz) as priority 2 · POC cost source (no Annex 3 item) · 21 days read as 15 working days</div><div class="m">${M.rev} · all figures from the draft SAR and ETECHS contract and its annexes; dates are a planning baseline, not approved by SAR</div><button class="go" style="align-self:center" id="goBack">Back to the start</button></div>`;$('#goBack').onclick=()=>go(0);},'Closing');
/* ---------- boot ---------- */
$('#hNo').textContent=M.no+' · '+M.rev;$('#hName').textContent=M.name.replace(/^\d+-/,'');
SL.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide';sec.id='sl'+i;$('#stage').appendChild(sec);const b=document.createElement('button');b.textContent=(i?i+' · ':'')+s.pill;b.onclick=()=>go(i);$('#pills').appendChild(b);});
$('#bPrev').onclick=()=>go(cur-1);$('#bNext').onclick=()=>go(cur+1);
$('#bFs').onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen();};
document.addEventListener('keydown',e=>{if(/input|select|textarea/i.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);else if(e.key==='Escape')closeD();});
(function(){const h=location.hash.slice(1);const i=SL.findIndex(s=>s.id===h);go(i>=0?i:0,true);})();
</script></body></html>
