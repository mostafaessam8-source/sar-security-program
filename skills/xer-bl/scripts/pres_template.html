<!doctype html>

<style>

@media print{#bar,#drawer,#dov{display:none}body{overflow:visible;background:#fff}#wrap{position:static;display:block}#deckbox{box-shadow:none;width:auto!important;height:auto!important}#deck{position:static;transform:none!important}.slide{display:block!important;position:relative;width:1280px;height:720px;page-break-after:always}}

<script>const DATA=%%DATA%%;const LOGO="data:image/png;base64,%%LOGO%%",LOGOW="data:image/png;base64,%%LOGOW%%";</script>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const PH={MOB:['Mobilization and site survey',C.gray,1],DES:['Design',C.blue,0],POC:['Proof of concept',C.yellow,1],ENA:['Enabling works',C.sky,1],PRO:['Procurement and supply',C.black,0],CON:['Construction and installation',C.red,0],COM:['Testing, commissioning and handover',C.slate,0],PMG:['Project management',C.mid,0]};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(Date.UTC(a,b-1,c));};

const mFull=i=>{const[y,m]=MON[i].split('-').map(Number);return MN[m-1]+' '+y;};
const monIdx=s=>{const d=dd(s),n=dd(M.ntp);return (d.getUTCFullYear()-n.getUTCFullYear())*12+d.getUTCMonth()-n.getUTCMonth();};
const mFrac=s=>(dd(s)-dd(M.ntp))/864e5/30.4375;
const addM=(iso,n)=>{const d=dd(iso);return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1)).toISOString().slice(0,10);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CH={};
Chart.defaults.font.family="'Diodrum Arabic','Segoe UI',system-ui,sans-serif";Chart.defaults.font.size=11;
function mkChart(id,cfg){if(CH[id])CH[id].destroy();const cv=document.getElementById(id);if(!cv)return;CH[id]=new Chart(cv,cfg);}
/* helpers: inches to px on a 1280x720 canvas (13.33 x 7.5 in) */
const IN=96;
const E=(x,y,w,h,inner='',cls='',st='',attr='')=>`<div class="a ${cls}" style="left:${x*IN}px;top:${y*IN}px;width:${w*IN}px;height:${h*IN}px;${st}" ${attr}>${inner}</div>`;
const T=(x,y,w,h,txt,pt,o={})=>E(x,y,w,h,o.vm?'<span>'+txt+'</span>':txt,(o.cls||'')+(o.vm?' vm':'')+(o.fit?' fit':''),`font-size:${pt*4/3}px;${o.b?'font-weight:700;':''}${o.c?'color:'+o.c+';':''}${o.al?'text-align:'+o.al+';':''}${o.vm&&o.al==='center'?'justify-content:center;':''}${o.vm&&o.al==='right'?'justify-content:flex-end;':''}${o.ls?'letter-spacing:'+o.ls+'px;':''}${o.lh?'line-height:'+o.lh+';':''}${o.st||''}`,o.attr||'');
const logoI=(x,y,h,src)=>`<img class="a" src="${src||LOGO}" alt="SAR" style="left:${x*IN}px;top:${y*IN}px;height:${h*IN}px">`;
function chrome(crumb,page,t,sub){return logoI(.45,.18,.46)+T(6.4,.30,6.5,.25,esc('Project 0580  |  '+crumb),9,{c:C.slate,al:'right'})+T(12.4,.58,.5,.25,page,9,{c:C.slate,al:'right'})+
  E(.45,6.98,12.43,0,'','','border-top:1.33px solid '+C.blue)+E(12.6,6.86,.24,.24,'','','border:1.33px solid '+C.blue+';border-radius:50%;background:#fff')+
  E(.45,.92,.20,.52,'','','background:'+C.blue+';clip-path:polygon(30% 0,100% 0,70% 100%,0 100%)')+T(.85,.88,11.9,.5,esc(t),22,{b:1,c:C.blue,vm:1,fit:1,st:'white-space:nowrap'})+T(.85,1.38,11.9,.3,esc(sub),12,{c:C.slate});}
const lbl=(txt,x,y,w)=>T(x,y,w||6,.25,txt,11,{b:1,c:C.blue,ls:1,st:'text-transform:uppercase;white-space:nowrap'});
/* drawer */
function drawer(t,s,html){$('#dT').textContent=t;$('#dS').innerHTML=s||'';$('#dB').innerHTML=html;$('#drawer').classList.add('on');$('#dov').classList.add('on');$('#dB').scrollTop=0;}
function closeD(){$('#drawer').classList.remove('on');$('#dov').classList.remove('on');}
$('#dX').onclick=closeD;$('#dov').onclick=closeD;
const tbl=(h,rows)=>`<table class="t"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
const actRows=l=>l.map(a=>`<tr><td>${a.id}</td><td style="text-align:left">${esc(a.n)}</td><td>${fD(a.s)}</td><td>${a.t==='T'?fD(a.f):'milestone'}</td><td>${a.t==='T'?a.d:'-'}</td></tr>`);
const actTable=l=>tbl(['ID','Activity','Start','Finish','Days'],actRows(l)).replace('<th>Activity','<th style="text-align:left">Activity');
function actDrawer(a){const ph=PH[a.ph]?PH[a.ph][0]:'';drawer(a.n,a.id+' · '+(a.t==='T'?'task':'milestone'),`<table class="t"><tbody>${[['Start',fD(a.s)],['Finish',a.t==='T'?fD(a.f):'-'],['Duration',a.t==='T'?a.d+' working days':'milestone'],['Phase',ph],['Responsible',a.rs],['Payment milestone',a.ms&&a.ms!=='-'?a.ms+' '+(DATA.ms_def[a.ms]?DATA.ms_def[a.ms].n:''):'-'],['Cost (contract conditions)','SAR '+fN(a.c)],['Progress value (fair EPC distribution)','SAR '+fN(a.p)],['Total float',a.fl+' working days (against the 36 month term)'],['Predecessors',a.pr.length?a.pr.join(', '):'none']].map(r=>`<tr><td>${r[0]}</td><td style="text-align:left">${esc(r[1])}</td></tr>`).join('')}</tbody></table>`);}
const stBtn=s=>`<button class="dbtn" data-st="${s.code}">Open ${esc(s.name)} schedule</button>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-st]');if(b&&b.closest('#drawer'))openStation(b.dataset.st);const g=e.target.closest('[data-go]');if(g)go(+g.dataset.go);});
function saveText(text,name,type){const b=new Blob([text],{type:type||'text/plain'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);}
/* generic gantt (used on the new slides) */
function gantt(host,o){
  const t0=dd(o.from).getTime(),t1=dd(o.to).getTime(),span=t1-t0,pcr=d=>(dd(d).getTime()-t0)/span*100,pc=d=>Math.max(0,Math.min(100,pcr(d)));
  const lw=o.lw||240,rh=o.rh||24;let h=`<div class="gantt" style="--lw:${lw}px;--rh:${rh}px"><div class="gh"><div class="gl">${o.head||'Activity'}</div><div class="gm">`;
  const months=[];let d=new Date(t0);d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1));while(d.getTime()<t1){months.push(d.getTime());d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1));}
  const step=o.step||1;months.forEach((m,i)=>{const nx=months[i+1]||t1,l=Math.max(0,(m-t0)/span*100),w=(nx-Math.max(m,t0))/span*100;if(i%step===0){const dt=new Date(m);h+=`<span style="left:${l}%;width:${w*step}%">${MN[dt.getUTCMonth()]+" '"+String(dt.getUTCFullYear()).slice(2)}</span>`;}});
  h+='</div></div><div style="position:relative">';h+=`<div style="position:absolute;left:${lw}px;right:0;top:0;bottom:0;pointer-events:none">`;
  months.forEach((m,i)=>{if(i%step===0){const l=(m-t0)/span*100;if(l>=0&&l<100)h+=`<i class="gvl" style="left:${l}%"></i>`;}});
  (o.bands||[]).forEach(b=>{h+=`<i class="gband" style="left:${pc(b.s)}%;width:${pc(b.f)-pc(b.s)}%;background:${b.c}"></i>`;});
  (o.lines||[]).forEach(b=>{const p=pcr(b.d);if(p>=0&&p<=100)h+=`<i class="gend" style="left:${p}%;border-color:${b.c||C.red}"></i>`;});h+='</div>';
  o.rows.forEach((r,i)=>{h+=`<div class="gr ${r.lv===0?'lv0':r.lv===1?'lv1':''} ${r.click?'c':''}" data-i="${i}" style="${r.rh?'min-height:'+r.rh+'px':''}"><div class="gl" style="padding-left:${8+(r.ind||0)*12}px"><span class="n" title="${esc(r.label)}">${r.label}</span>${r.sub?`<small>${r.sub}</small>`:''}</div><div class="gt">`;
    (r.bars||[]).forEach(b=>{const l=pcr(b.s),w=Math.max(.35,pcr(b.f)-l+(100*86400000/span)),cl=Math.max(0,l),cw=Math.min(100,l+w)-cl;if(cw<=0)return;const hh=b.h||12,top=b.top!=null?b.top:Math.round(((r.rh||rh)-hh)/2);
      h+=`<i class="gb ${b.dk?'dk':''}" style="left:${cl}%;width:${cw}%;top:${top}px;height:${hh}px;background:${b.c}" title="${esc(b.t||'')}">${b.l&&cw>6?esc(b.l):''}</i>`;});
    (r.ms||[]).forEach(m=>{const p=pcr(m.d);if(p<0||p>100)return;h+=`<i class="gd ${m.f?'f':''}" style="left:${p}%;top:${Math.round(((r.rh||rh)-12)/2)}px" title="${esc(m.t||'')}"></i>`;});h+='</div></div>';});
  h+='</div></div>';host.innerHTML=h;if(o.click)$$('.gr.c',host).forEach(e=>e.onclick=()=>o.click(o.rows[+e.dataset.i]));}
const stationWin=(code,phs)=>{const l=AC.filter(a=>a.stn===code&&a.t==='T'&&phs.includes(a.ph));return l.length?[l.reduce((m,a)=>a.s<m?a.s:m,'9999'),l.reduce((m,a)=>a.f>m?a.f:m,'0000')]:null;};
/* derived data */
const lineShare=l=>DATA.line_val[l]/M.po;
const invByMonthLine=()=>{const o={NSR:Array(36).fill(0),EWR:Array(36).fill(0),HHR:Array(36).fill(0)};DATA.events.forEach(e=>{const i=Math.min(35,monIdx(e.d));if(e.l==='ALL'){['NSR','EWR','HHR'].forEach(l=>o[l][i]+=e.a*lineShare(l));}else o[e.l][i]+=e.a;});return o;};
/* ---------- slide registry ---------- */
const SL=[];function slide(id,fn,short){SL.push({id,fn,short});}
let cur=0;
function go(i,nohash){cur=Math.max(0,Math.min(SL.length-1,i));$$('.slide').forEach((s,k)=>s.classList.toggle('on',k===cur));$$('#dots i').forEach((d,k)=>d.classList.toggle('on',k===cur));$('#cnt').textContent=(cur+1)+' / '+SL.length;
  const s=SL[cur],el=$$('.slide')[cur];if(!s.done||s.always){s.fn(el);s.done=true;}if(!nohash)try{history.replaceState(null,'','#'+s.id);}catch(e){}closeD();fitTitles(el);}
function fitTitles(el){$$('.fit',el).forEach(b=>{const sp=b.firstChild;let fs=parseFloat(b.style.fontSize);b.style.fontSize=fs+'px';while(sp.offsetWidth>b.clientWidth&&fs>16){fs-=1;b.style.fontSize=fs+'px';}});}
function fit(){const w=innerWidth,h=innerHeight-44,s=Math.min(w/1280,h/720);const b=$('#deckbox');b.style.width=1280*s+'px';b.style.height=720*s+'px';$('#deck').style.transform=`scale(${s})`;}
addEventListener('resize',fit);
